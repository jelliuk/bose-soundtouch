name: Validate Release Assets

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate'
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          VERSION=${TAG#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Validate Docker images
        run: |
          echo "🔍 Validating Docker images..."
          
          REGISTRY="ghcr.io"
          IMAGE="${{ github.repository }}"
          VERSION="${{ steps.tag.outputs.version }}"
          
          # Check if images exist for both architectures
          for ARCH in amd64 arm64; do
            echo "Checking ${REGISTRY}/${IMAGE}:${VERSION} for ${ARCH}..."
            docker manifest inspect ${REGISTRY}/${IMAGE}:${VERSION} | grep -q ${ARCH}
            if [ $? -eq 0 ]; then
              echo "✅ ${ARCH} image found"
            else
              echo "❌ ${ARCH} image NOT found"
              exit 1
            fi
          done
          
          echo "✅ All Docker images validated"
      
      - name: Test Docker image
        run: |
          echo "🧪 Testing Docker image..."
          
          REGISTRY="ghcr.io"
          IMAGE="${{ github.repository }}"
          VERSION="${{ steps.tag.outputs.version }}"
          
          # Pull and test the image
          docker pull ${REGISTRY}/${IMAGE}:${VERSION}
          
          # Basic smoke test - container should start
          docker run --rm ${REGISTRY}/${IMAGE}:${VERSION} node --version
          
          echo "✅ Docker image test passed"
      
      - name: Generate validation report
        run: |
          cat > validation-report.md << 'EOF'
          ## ✅ Release Asset Validation (Post-Publish): PASSED
          
          **Status:** Live release assets re-validated ✅  
          **Validated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Workflow:** ${{ github.workflow }} #${{ github.run_number }}
          
          ### Validation Results
          
          - All required assets present ✓
          - Docker images verified ✓
          - Multi-architecture builds validated ✓
          - Version strings correct ✓
          EOF
          
          cat validation-report.md
      
      - name: Update release description
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: validation-report.md
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Comment on validation success
        run: |
          echo "✅ Release ${{ steps.tag.outputs.tag }} has been validated successfully"
